<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>

<link rel= "stylesheet" href="styles/mystyle.css"
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تعليمات الحالات الفلسطينية | بنك الطعام</title>
    <!-- استدعاء أيقونات FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --efb-red: #d63031;
            --efb-green: #00a651;
            --warning-bg: #fff5f5;
            --text-dark: #2d3436;
            --card-shadow: 0 10px 20px rgba(0,0,0,0.08);
        }

        body {
            background-color: #f0f2f5;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            color: var(--text-dark);
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        /* رأس الصفحة */
        .header {
            background: white;
            padding: 30px;
            border-radius: 15px;
            text-align: center;
            box-shadow: var(--card-shadow);
            border-bottom: 5px solid var(--efb-red);
            margin-bottom: 25px;
        }

        .header h1 {
            color: var(--efb-red);
            margin: 0;
            font-size: 28px;
            text-decoration: underline;
        }

        /* صندوق الإجراء العاجل */
        .urgent-action {
            background: var(--warning-bg);
            border: 2px dashed var(--efb-red);
            border-radius: 15px;
            padding: 25px;
            margin-bottom: 30px;
            position: relative;
        }

        .urgent-action h2 {
            color: var(--efb-red);
            font-size: 20px;
            margin-top: 0;
            display: flex;
            align-items: center;
        }

        .urgent-action h2 i { margin-left: 10px; }

        .urgent-action p {
            font-size: 17px;
            line-height: 1.8;
            font-weight: bold;
            margin: 0;
        }

        /* قائمة السيناريوهات */
        .scenarios-grid {
            display: grid;
            gap: 15px;
        }

        .scenario-card {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.03);
            display: flex;
            align-items: center;
            border-right: 5px solid var(--efb-green);
            transition: 0.3s;
        }

        .scenario-card:hover {
            transform: translateX(-5px);
            box-shadow: var(--card-shadow);
        }

        .scenario-icon {
            width: 45px;
            height: 45px;
            background: rgba(0, 166, 81, 0.1);
            color: var(--efb-green);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            margin-left: 20px;
            flex-shrink: 0;
        }

        .scenario-text {
            font-size: 15px;
            font-weight: 500;
        }

        /* التذييل */
        .footer-note {
            text-align: center;
            margin-top: 40px;
            padding: 20px;
            background: #fff;
            border-radius: 10px;
            color: var(--efb-green);
            font-weight: bold;
        }

        @media (max-width: 600px) {
            .header h1 { font-size: 22px; }
            .urgent-action p { font-size: 15px; }
        }
    </style>
</head>
<body>

<div class="container">
    <!-- العنوان الرئيسي -->
    <header class="header">
        <h1>بخصوص الحالات الفلسطينية (مهم جداً)</h1>
    </header>

    <!-- الإجراء العاجل لمشكلة صرف العريش -->
<!--
    <div class="urgent-action">
        <h2><i class="fa-solid fa-triangle-exclamation"></i> تعليمات صرف قسيمة الـ 1500 جنيه:</h2>
        <p>
            في حال تواصل أي حالة فلسطينية بخصوص <span style="color:var(--efb-red)">قسيمة الـ 1500 جنيه</span> 
            المقرر صرفها من بريد العريش، وكان العميل معترضاً لعدم تواجده في العريش؛ 
            يتم توضيح أن <span style="background: yellow;">موظفاً تابعاً لبنك الطعام سيتواصل معه في أقرب وقت لحل المشكلة.</span>
        </p>
    </div>
-->

    <!-- سيناريوهات الرد السريع -->
    <div class="scenarios-grid">
        
        <!-- الحالة 1 -->
        <div class="scenario-card">
            <div class="scenario-icon"><i class="fa-solid fa-calendar-check"></i></div>
            <div class="scenario-text">             فى حالة ان الحالة تستلم اكواد بشكل شهرى و وضحت انها لم تستلم منذ شهر حتى 11 شهر يتم تقديم شكوى قسائم (OTP)    </div>
        </div>

        <!-- الحالة 2 -->
        <div class="scenario-card">
            <div class="scenario-icon"><i class="fa-solid fa-phone-flip"></i></div>
            <div class="scenario-text">في حالة الرغبة في <b>تعديل رقم الهاتف</b>: يتم توجيه الحالة للرجوع إلى مشرف بنك الطعام.</div>
        </div>

        <!-- الحالة 3 -->

        <div class="scenario-card">
            <div class="scenario-icon"><i class="fa-solid fa-envelope-open-text"></i></div>
            <div class="scenario-text">الاستفسار عن رسالة بنك الطعام بقيمة <b>1550 جنيه</b> (استلام بريد): تم التوضيح للعميل.</div>
        </div>
-->

        
             
    </div>

    
</div>

</body>
</html>
