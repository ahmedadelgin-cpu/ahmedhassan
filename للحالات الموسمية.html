<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<link rel= "stylesheet" href="styles/mystyle.css"
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تحديث الحالات الموسمية - بنك الطعام</title>
    <style>
        :root {
            --efb-green: #00a651;
            --efb-red: #d63031;
            --bg-white: #ffffff;
            --soft-gray: #f8f9fa;
            --text-dark: #2d3436;
        }

        body {
            background-color: var(--bg-white);
            color: var(--text-dark);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 40px 20px;
            display: flex;
            justify-content: center;
        }

        .info-card {
            max-width: 700px;
            width: 100%;
            background: var(--bg-white);
            border: 1px solid #eee;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
            overflow: hidden;
            border-top: 6px solid var(--efb-red);
        }

        /* رأس البطاقة */
        .card-header {
            text-align: center;
            padding: 30px 20px;
            background: #fff5f5;
        }

        .card-header h1 {
            color: var(--efb-red);
            margin: 0;
            font-size: 26px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
        }

        .icon-large {
            font-size: 35px;
        }

        /* محتوى الشروط */
        .card-body {
            padding: 30px;
        }

        .condition-box {
            display: flex;
            align-items: center;
            gap: 15px;
            background: var(--soft-gray);
            padding: 20px;
            border-radius: 12px;
            margin-bottom: 20px;
            border-right: 5px solid var(--efb-green);
        }

        .condition-text {
            font-size: 18px;
            font-weight: 500;
            color: #444;
        }

        .or-divider {
            text-align: center;
            margin: -10px 0 10px;
            font-weight: bold;
            color: #999;
            font-size: 14px;
        }

        /* النتيجة النهائية */
        .action-box {
            background: var(--efb-green);
            color: white;
            text-align: center;
            padding: 20px;
            border-radius: 12px;
            margin-top: 30px;
            font-size: 20px;
            font-weight: bold;
            box-shadow: 0 4px 15px rgba(0, 166, 81, 0.2);
        }

        .footer-note {
            text-align: center;
            padding: 15px;
            font-size: 14px;
            color: #999;
            border-top: 1px solid #eee;
        }

    </style>
</head>
<body>
<center>
<div class="info-card">
    <!-- العنوان -->
    <div class="card-header">
        <h1>
            <span class="icon-large">😊</span>
            مهم جداً للحالات الموسمية
        </h1>
    </div>

   
        
        

        <!-- الشرط الثاني -->
        <div class="condition-box">
            <span class="icon-large">⏳</span>
            <div class="condition-text">الحالات التي لم تستلم أي مساعدات منذ أكثر من سنة.</div>
        </div>
<!-- الشرط الثاني -->
        <div class="condition-box">
            <span class="icon-large">⏳</span>
            <div class="condition-text">الحالات الموسيميه ( أ ) فى حاله عدم الاستلام خلال فتره اقل من سنه يتم تسجيل شكوى انقطاع كرتونه  </div>
        </div>


        <!-- النتيجة -->
        <div class="action-box">
            ✅ الإجراء: سيتم تقديم طلب مساعدة جديد 
        </div>
    </div>
<!--
    <div class="footer-note">
        نظام تحديث قاعدة بيانات بنك الطعام المصري 2024
    </div>
-->
</div>
</center>

</body>
</html>
